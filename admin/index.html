<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Ajob Data Admin</title><link rel="stylesheet" href="/admin/admin.css"></head><body><div id="login" class="login"><div class="loginBox"><img src="/assets/logo.png"><h1>Ajob <em>Data</em></h1><p>ADMIN CONTROL CENTER</p><input id="pw" type="password" placeholder="Admin password"><button onclick="login()">Enter Dashboard</button><small>Configure ADMIN_PASSWORD on the server.</small></div></div><div id="app" class="app hidden"><aside><div class="adminBrand"><img src="/assets/logo.png"><b>Ajob <em>Data</em></b></div><button onclick="show('dash')">Dashboard</button><button onclick="show('products')">Products</button><button onclick="show('orders')">Orders</button><button onclick="show('agents')">Agents</button><button onclick="show('settings')">Website Settings</button><button onclick="show('social')">Social Links</button><button onclick="logout()">Logout</button></aside><main><section id="dash"><h1>Dashboard</h1><div id="stats" class="stats"></div></section><section id="products" class="hidden"><h1>Products</h1><form onsubmit="addProduct(event)"><input id="pn" placeholder="Product name" required><input id="pc" placeholder="Category" required><input id="pp" type="number" placeholder="Price" required><input id="pi" placeholder="Image filename e.g. product-1.jpg" value="product-1.jpg"><input id="ps" type="number" placeholder="Stock" value="10"><button>Add Product</button></form><div id="plist"></div></section><section id="orders" class="hidden"><h1>Orders</h1><div id="olist"></div></section><section id="agents" class="hidden"><h1>Agents</h1><form onsubmit="addAgent(event)"><input id="an" placeholder="Name" required><input id="aph" placeholder="Phone"><input id="aw" placeholder="WhatsApp"><button>Add Agent</button></form><div id="alist"></div></section><section id="settings" class="hidden"><h1>Website Settings</h1><label>About Store<textarea id="about"></textarea></label><label>Delivery Time<input id="delivery"></label><label>Delivery Fee<input id="fee"></label><label>Payment Info<input id="pay"></label><button onclick="saveMain()">Save Changes</button></section><section id="social" class="hidden"><h1>Social Links</h1><label>Instagram<input id="ig"></label><label>Facebook<input id="fb"></label><label>TikTok<input id="tt"></label><label>WhatsApp<input id="wa"></label><button onclick="saveSocial()">Save Social Links</button></section></main></div><script src="/admin/admin.js"></script></body></html>
